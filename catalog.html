<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>두레생협 2026 추석 선물세트 전체 카탈로그</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root{
  --bg:#FAF7F0;
  --surface:#FFFFFF;
  --ink:#2A2018;
  --ink-soft:#6B5D4C;
  --primary:#1D3620;
  --primary-deep:#12210F;
  --gold:#A87B1E;
  --border:#E4DCC8;
  --shadow:0 2px 10px rgba(42,32,24,0.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171310;
    --surface:#211C16;
    --ink:#F1EAD9;
    --ink-soft:#C2B49E;
    --primary:#8CBB84;
    --primary-deep:#12210F;
    --gold:#E3BE66;
    --border:#38311F;
    --shadow:0 2px 10px rgba(0,0,0,0.4);
  }
}
:root[data-theme="dark"]{
  --bg:#171310;
  --surface:#211C16;
  --ink:#F1EAD9;
  --ink-soft:#C2B49E;
  --primary:#8CBB84;
  --primary-deep:#12210F;
  --gold:#E3BE66;
  --border:#38311F;
  --shadow:0 2px 10px rgba(0,0,0,0.4);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR','Malgun Gothic',sans-serif;line-height:1.7}
.topbar{position:sticky;top:0;z-index:10;background:var(--primary-deep);color:#FAF7F0;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:var(--shadow)}
.topbar a{color:#F1E3BE;text-decoration:none;font-size:13.5px;font-weight:700;white-space:nowrap}
.topbar a:hover{text-decoration:underline}
.topbar .tb-title{font-family:'Noto Serif KR',serif;font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrap{max-width:900px;margin:0 auto;padding:28px 16px 60px}
.head{text-align:center;margin-bottom:28px}
.head .eyebrow{font-size:12px;font-weight:700;letter-spacing:0.08em;color:var(--gold);text-transform:uppercase;margin-bottom:10px}
.head h1{font-family:'Noto Serif KR',serif;font-weight:900;font-size:26px;margin:0 0 10px;text-wrap:balance}
.head p{font-size:14px;color:var(--ink-soft);max-width:480px;margin:0 auto}
.pages{display:flex;flex-direction:column;gap:14px}
.page-item{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
.page-item img{display:block;width:100%;height:auto}
.page-num{position:absolute;bottom:10px;right:10px;background:rgba(18,33,15,0.72);color:#F1E3BE;font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;font-family:'Noto Serif KR',serif}
.backtotop{position:fixed;right:18px;bottom:18px;background:var(--primary);color:#fff;border:none;border-radius:50%;width:46px;height:46px;font-size:18px;cursor:pointer;box-shadow:var(--shadow);display:none;align-items:center;justify-content:center}
.backtotop.show{display:flex}
</style>
</head>
<body>
  <div class="topbar">
    <span class="tb-title">2026 한가위 두레생협 추석 선물세트 카탈로그</span>
    <a href="https://chh-navi87.github.io/chuseok26-b2b-catalog/">← 특별관으로 돌아가기</a>
  </div>
  <div class="wrap">
    <div class="head">
      <div class="eyebrow">Full Catalog · 60p</div>
      <h1>두레생협 2026 추석 선물세트<br>전체 카탈로그</h1>
      <p>원주생협 × 춘천두레생협에서 준비한 2026년 한가위 선물세트 전체 목록입니다. 아래로 스크롤하며 페이지를 넘기듯 확인해보세요.</p>
    </div>
    <div class="pages" id="pages"></div>
  </div>
  <button class="backtotop" id="backtotop" title="맨 위로" aria-label="맨 위로">↑</button>

<script>
const TOTAL_PAGES = 60;
const BASE = 'https://ecoop.or.kr/DureShop/g/chuseok26/p/p';
const pagesEl = document.getElementById('pages');
let html = '';
for (let i = 1; i <= TOTAL_PAGES; i++) {
  const num = String(i).padStart(2, '0');
  html += `<div class="page-item"><img src="${BASE}${num}.jpg" alt="카탈로그 ${i}페이지" loading="lazy" decoding="async"><span class="page-num">${i} / ${TOTAL_PAGES}</span></div>`;
}
pagesEl.innerHTML = html;

const backBtn = document.getElementById('backtotop');
window.addEventListener('scroll', () => {
  backBtn.classList.toggle('show', window.scrollY > 800);
});
backBtn.addEventListener('click', () => window.scrollTo({top:0, behavior:'smooth'}));
</script>
</body>
</html>
